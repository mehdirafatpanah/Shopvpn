<!DOCTYPE html>
<!--‍​‌‌​​​‌‌​‌‌​​‌​‌​‌‌​‌‌​​​‌‌​​‌​‌​‌‌​‌‌‌​​‌‌​‌‌‌‌​‌‌‌​​‌​‍-->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>پنل مدیریت ShopVPN</title>

<!-- PWA: قابلیت نصب روی هوم‌اسکرین (اندروید + آیفون). href با ?b=... همان
     صفحه ست می‌شود تا بعد از نصب، آیکون به پنل همان نماینده باز شود. -->
<link rel="manifest" id="pwa-manifest-link" href="/manifest.json">
<meta name="theme-color" content="#0B0C14">
<meta name="asset-version" content="{{ASSET_VERSION}}">

<!-- آیفون (سافاری از manifest.json پشتیبانی کامل ندارد؛ این متاتگ‌ها لازم‌اند) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShopVPN">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

<!--SV_FONTS_START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet"></noscript>

<!--SV_PRELOAD-->
<link rel="stylesheet" href="/assets/style.css">
<script>
(function(){
  var t = { theme:'enterprise', mode:'light' };
  try{ t = JSON.parse(localStorage.getItem('sv-theme') || 'null') || t; }catch(e){}
  var theme = t.theme || 'enterprise', mode = t.mode || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-mode', mode);

  // رنگ نوار وضعیت اندروید / آدرس‌بار مرورگر و اسپلش‌اسکرین PWA را با
  // تم و حالت روشن/تیره‌ی فعلی هماهنگ می‌کند (مهم‌ترین مورد: تم اندروید
  // که برخلاف بقیه‌ی تم‌ها به‌صورت پیش‌فرض روشنه)
  var themeColors = { enterprise: { light: '#F7F9FC', dark: '#0B1220' }, android: { light: '#FEF7FF', dark: '#141218' } };
  var tc = (themeColors[theme] && themeColors[theme][mode]) || '#0B0C14';
  var metaTag = document.querySelector('meta[name="theme-color"]');
  if (metaTag) metaTag.setAttribute('content', tc);

  // manifest باید همان query string صفحه (مثلا ?b=xyz برای نماینده) به‌علاوه‌ی
  // تم/مود فعلی را داشته باشد، وگرنه بعد از نصب روی هوم‌اسکرین رنگ اسپلش‌اسکرین
  // و نوار وضعیت با تم انتخابی کاربر ست نمی‌شود
  var link = document.getElementById('pwa-manifest-link');
  if (link) {
    var params = new URLSearchParams(location.search);
    params.set('theme', theme);
    params.set('mode', mode);
    link.href = '/manifest.json?' + params.toString();
  }
})();
</script>
<script>
(function(){
  const dict = {
    "پنل مدیریت ShopVPN":"ShopVPN Admin Panel",
    "برای ورود، اطلاعات حساب پنل وب را وارد کن":"Enter your web panel credentials to sign in",
    "یوزرنیم":"Username","پسورد":"Password","ورود":"Sign in",
    "راه‌اندازی پنل نمایندگی":"Reseller panel setup",
    "یک یوزرنیم و پسورد برای پنل وب خودت انتخاب کن":"Choose a username and password for your web panel",
    "ساخت حساب و ورود":"Create account & sign in",
    "پنل مدیریت":"Admin panel",
    "تغییر زبان / Change language":"Change language / تغییر زبان",
    "اتصال زنده":"Live connection"
  };
  function lang(){ return localStorage.getItem("sv-lang") || "fa"; }
  function apply(){
    const en=lang()==="en";
    document.documentElement.lang=en?"en":"fa";
    document.documentElement.dir=en?"ltr":"rtl";
    document.body.classList.toggle("i18n-en",en);
    document.querySelectorAll("[data-i18n-toggle]").forEach(b=>b.textContent=en?"🇮🇷 فارسی":"🇬🇧 English");
    if(en){
      const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
      const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
      nodes.forEach(n=>{ const t=n.nodeValue.trim(); if(dict[t]) n.nodeValue=n.nodeValue.replace(t,dict[t]); });
    }
    // نکته: قبلاً اینجا برای حالت غیر-انگلیسی location.reload() می‌زدیم تا
    // اگر قبلاً متن‌ها به انگلیسی جایگزین شده بودن، با رفرش به فارسیِ اصلیِ
    // سرور برگردیم. اما apply() همینجا، بدون قید و شرط، تو هر DOMContentLoaded
    // صدا زده میشه - و چون lang() پیش‌فرضش "fa" هست، یعنی برای تقریبا همه‌ی
    // کاربرها (که هیچوقت زبان رو دستی عوض نکردن) هر بار صفحه لود میشد،
    // بلافاصله reload می‌خورد، و از اول... یعنی یک حلقه‌ی بی‌نهایت رفرش.
    // سوییچ واقعی از انگلیسی به فارسی از قبل با reload خودش تو
    // ShopVPNSetLanguage هندل میشه، پس این reload اینجا هم اضافه بود و هم
    // مخرب - حذفش کردیم.
  }
  window.ShopVPNSetLanguage=async function(l){
    localStorage.setItem("sv-lang",l);
    try{ await fetch("/api/language", {method:"POST", credentials:"include", headers:{"Content-Type":"application/json"}, body:JSON.stringify({language:l})}); }catch(e){}
    await window.ShopVPNLoadLanguage?.(l);
    location.reload();
  };
  window.ShopVPNShowLanguagePicker=async function(btn){
    let old=document.getElementById("admin-language-picker"); if(old){old.remove();return;}
    let langs=[]; try{ const r=await fetch("/api/languages",{credentials:"include"}); if(r.ok) langs=await r.json(); }catch(e){}
    const box=document.createElement("div"); box.id="admin-language-picker"; box.style.cssText="position:fixed;top:58px;right:16px;z-index:10000;background:var(--card,#fff);border:1px solid rgba(127,127,127,.2);border-radius:14px;padding:8px;box-shadow:0 12px 35px rgba(0,0,0,.2);min-width:170px;";
    langs.filter(x=>x.enabled).forEach(x=>{ const a=document.createElement("button"); a.type="button"; a.textContent=`${x.flag||""} ${x.native_name||x.name}`; a.className="btn btn-ghost"; a.style.cssText="display:block;width:100%;margin:2px 0;text-align:start;"; a.onclick=()=>ShopVPNSetLanguage(x.code); box.appendChild(a); });
    document.body.appendChild(box);
  };
  window.addEventListener("DOMContentLoaded",function(){
    const b=document.createElement("button");
    b.type="button"; b.className="btn btn-ghost"; b.setAttribute("data-i18n-toggle","");
    b.textContent=lang()==="en"?"🇮🇷 فارسی":"🇬🇧 English";
    b.onclick=()=>window.ShopVPNShowLanguagePicker(b);
    const top=document.querySelector(".topbar-actions")||document.querySelector(".topbar");
    if(top) top.prepend(b);
    apply();
  });
})();
</script>
</head>
<body>

<script id="sv-loader" data-i18n="/assets/i18n.js" data-app="/assets/app.js">
(function () {
  var me = document.getElementById('sv-loader');
  var CH = 40000, PAR = 4, TO = 10000, TRIES = 8, ready = false;
  var btn = document.getElementById('login-submit'), label = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'در حال بارگذاری...'; }
  document.addEventListener('submit', function (e) { if (!ready) e.preventDefault(); }, true);
  function done() {
    ready = true;
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function getBuf(url) {
    for (var a = 0; a < TRIES; a++) {
      var c = new AbortController(), t = setTimeout(function () { c.abort(); }, TO);
      try {
        var r = await fetch(url, { signal: c.signal, credentials: 'same-origin' });
        if (!r.ok) throw new Error('http');
        var b = await r.arrayBuffer();
        clearTimeout(t);
        return { b: b, n: r.headers.get('X-Chunks') };
      } catch (e) {
        clearTimeout(t);
        await sleep(400 * (a + 1));
      }
    }
    throw new Error('chunk');
  }
  function base(p) { return p.split('/').pop().replace('.min', ''); }
  async function direct(src) {
    for (var a = 0; a < 2; a++) {
      var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 25000);
      try {
        var r = await fetch(src, { signal: c.signal, credentials: 'same-origin' });
        if (!r.ok) throw new Error('http');
        var text = await r.text();
        clearTimeout(t);
        return text;
      } catch (e) {
        clearTimeout(t);
        await sleep(300);
      }
    }
    return null;
  }
  async function chunked(u) {
    var name = u.pathname.split('/').pop();
    var prefix = '/_chunk/' + name + '/';
    var first = await getBuf(prefix + '0' + u.search);
    var n = parseInt(first.n, 10);
    if (!(n >= 1)) throw new Error('count');
    var parts = new Array(n), next = 1;
    parts[0] = first.b;
    async function worker() {
      while (next < n) {
        var i = next++;
        parts[i] = (await getBuf(prefix + i + u.search)).b;
      }
    }
    var ws = [];
    for (var k = 0; k < Math.min(PAR, n - 1); k++) ws.push(worker());
    await Promise.all(ws);
    var total = parts.reduce(function (s, p) { return s + p.byteLength; }, 0);
    var all = new Uint8Array(total), off = 0;
    parts.forEach(function (p) { all.set(new Uint8Array(p), off); off += p.byteLength; });
    return new TextDecoder('utf-8').decode(all);
  }
  async function load(src) {
    var u = new URL(src, location.href), key = u.pathname + u.search;
    var cache = null;
    try {
      cache = await caches.open('sv-assets');
      var hit = await cache.match(key);
      if (hit) return await hit.text();
    } catch (e) {}
    var text = await direct(src);
    if (text === null) text = await chunked(u);
    try {
      if (cache) {
        (await cache.keys()).forEach(function (r) {
          var x = new URL(r.url);
          if (base(x.pathname) === base(u.pathname) && x.pathname + x.search !== key) cache.delete(r);
        });
        await cache.put(key, new Response(text, { headers: { 'Content-Type': 'application/javascript' } }));
      }
    } catch (e) {}
    return text;
  }
  function run(text, src) {
    var s = document.createElement('script');
    s.text = text + '\n//# sourceURL=' + src;
    document.head.appendChild(s);
    s.remove();
  }
  function plain(src) {
    return new Promise(function (res) {
      var s = document.createElement('script');
      s.async = false; s.src = src; s.onload = s.onerror = res;
      document.head.appendChild(s);
    });
  }
  (async function () {
    var list = [me.getAttribute('data-i18n'), me.getAttribute('data-app')];
    try {
      var texts = await Promise.all(list.map(load));
      texts.forEach(function (t, i) { run(t, list[i]); });
    } catch (e) {
      for (var i = 0; i < list.length; i++) await plain(list[i]);
    }
    done();
  })();
})();
</script>
