<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#070A1A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F7FC" media="(prefers-color-scheme: light)">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="{{CANON}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="alternate" hreflang="fa" href="{{ALT_FA}}">
<link rel="alternate" hreflang="en" href="{{ALT_EN}}">
<link rel="alternate" hreflang="x-default" href="{{ALT_FA}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070A1A'/%3E%3Cpath d='M12 44C24 12 40 52 52 20' fill='none' stroke='%2335E6CB' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="/assets/boot.js?v={{ASSET_VERSION}}" defer></script>
<link rel="stylesheet" href="/assets/app.css?v={{ASSET_VERSION}}">
<link rel="stylesheet" href="/assets/network-map.css?v={{ASSET_VERSION}}">
<link rel="stylesheet" href="/assets/hero-scene.css?v={{ASSET_VERSION}}">
{{SCENE_STYLES}}
<meta name="sv-3d" content="{{SCENE_MODE}}" data-mobile="{{SCENE_MOBILE}}" data-lite="{{SCENE_LITE}}">
</head>
<body>
<a class="skip" href="#view" data-i18n="skip">رفتن به محتوا</a>
<div class="aurora" aria-hidden="true"><i></i><i></i></div>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/" id="brand">
      <img id="brandLogo" alt="" hidden>
      <span class="mark" id="brandMark" aria-hidden="true"></span>
      <span id="brandName">ShopVPN</span>
    </a>
    <nav class="links" aria-label="main">
      <a href="#/plans" data-nav="plans" data-i18n="nav_plans">پلن‌ها</a>
      <a href="#/guide" data-nav="guide" data-i18n="nav_guide">راهنمای اتصال</a>
      <a href="#/faq" data-nav="faq" data-i18n="nav_faq">سؤالات متداول</a>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" type="button" data-i18n-label="theme"></button>
      <button class="icon-btn txt" id="langBtn" type="button" data-i18n-label="language"></button>
      <a class="btn small ghost" id="accountBtn" href="#/account" hidden data-i18n="nav_account">حساب من</a>
      <button class="btn small danger" id="logoutBtn" type="button" hidden data-i18n="logout">خروج از حساب</button>
      <a class="btn small" id="loginBtn" href="#/login" data-i18n="login">ورود</a>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>



<footer class="foot">
  <div class="wrap foot-in">
    <div class="foot-brand"><b id="footName">ShopVPN</b><span id="footTag"></span></div>
    <nav class="foot-links" aria-label="footer">
      <a href="#/guide" data-i18n="nav_guide">راهنمای اتصال</a>
      <a href="#/faq" data-i18n="nav_faq">سؤالات متداول</a>
      <a href="#/terms" data-i18n="nav_terms">قوانین و تماس</a>
      <a id="supportLink" href="#/terms" target="_blank" rel="noopener" hidden data-i18n="support">پشتیبانی</a>
      <a id="botLink" href="#/" target="_blank" rel="noopener" hidden data-i18n="bot">ربات تلگرام</a>
    </nav>
  </div>
</footer>

<nav class="tabbar" aria-label="mobile">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span data-i18n="tab_home">خانه</span></a>
  <a href="#/plans" data-nav="plans"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8zM9 7a3 3 0 0 1 6 0"/></svg><span data-i18n="tab_plans">پلن‌ها</span></a>
  <a href="#/account" data-nav="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-i18n="tab_account">حساب</span></a>
  <a href="#/guide" data-nav="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/></svg><span data-i18n="tab_help">راهنما</span></a>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" type="button" data-i18n-label="close"></button></div>
  <div id="sheetBody"></div>
</dialog>

<noscript><p class="wrap noscript">برای استفاده از فروشگاه، جاوااسکریپت مرورگر را فعال کنید. / Please enable JavaScript to use the store.</p></noscript>
<script src="/assets/i18n.js?v={{ASSET_VERSION}}" defer></script>
<script src="/assets/network-map-data.js?v={{ASSET_VERSION}}" defer></script>
<script src="/assets/network-map.js?v={{ASSET_VERSION}}" defer></script>
{{SCENE_SCRIPTS}}
<script src="/assets/app.js?v={{ASSET_VERSION}}" defer></script>
</body>
</html>
